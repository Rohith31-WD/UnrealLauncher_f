name: "CodeQL"

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  schedule:
    - cron: '28 17 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'rust' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        queries: security-extended,security-and-quality

    # For Rust, we need to build the project as CodeQL needs the compiled artifacts
    - name: Build Rust (native)
      if: matrix.language == 'rust'
      run: |
        cargo build --manifest-path native/Cargo.toml
        cargo build --manifest-path tracer/Cargo.toml

    # For JavaScript/TypeScript, CodeQL typically uses autobuild or doesn't require a build
    # But since this is an Electron project, we'll ensure dependencies are installed
    - name: Install dependencies (JS/TS)
      if: matrix.language == 'javascript-typescript'
      run: npm ci

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
